<html lang="en">
<head>

	<title>Daily Update Page</title>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

	<style>

			font-family: Arial, sans-serif;
			max-width: 900px;
			margin: 40px auto;
			padding: 20px;
